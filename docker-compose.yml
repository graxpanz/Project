services:
    backend:
        build: ./src/
        ports:
            - "8080:80"
        volumes:
            - ./src:/var/www/html
        environment:
            - ALLOW_OVERRIDE=true
        links:
            - database
        depends_on:
            - database

    database:
        # image: arm64v8/mariadb:latest # open for mac apple chip
        image: mariadb:latest # open for windows
        restart: always
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: 'mira'
            MYSQL_PASSWORD: 'P@ssw0rd'
            MYSQL_ROOT_PASSWORD: 'P@ssw0rd'
        expose:
            - '3306'
        volumes:
            - ./mysqldata:/var/lib/mysql
            - ./mysqldata/mira.sql:/docker-entrypoint-initdb.d/mira.sql

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - "8081:80"
        environment:
            PMA_HOST: database
            PMA_USER: root
            PMA_PASSWORD: 'P@ssw0rd'
            MYSQL_ROOT_PASSWORD: 'P@ssw0rd'
        depends_on:
            - database

volumes:
    mysqldata: